name: AI Code Review

# Optional check (not in branch protection): the packages/code-reviewer agent reviews every ready PR to master,
# posts one comment (updated in place) and sets ai-cr:passed or ai-cr:failed. Adding the label ai-cr:review re-runs it
# (also the way to review a draft). The labels must already exist: this token has no issues: write.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

# An unrelated label change starts a run that the job `if` skips; it must not cancel a real review, so those
# events get their own group.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-cr:review') && 'noise' || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only (forks get no secrets); drafts only through the ai-cr:review label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check the API key is configured
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::OPENROUTER_API_KEY secret is not set; skipping the AI review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/code-reviewer/package-lock.json

      - name: Compute the PR diff
        id: diff
        if: steps.key.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/pr.diff"
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The diff is empty; nothing to review."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the diff
        id: review
        if: steps.key.outputs.present == 'true' && steps.diff.outputs.empty == 'false'
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.REVIEW_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          diff-file: ${{ runner.temp }}/pr.diff
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}

      - name: Publish the comment (updated in place)
        if: steps.review.outcome == 'success'
        env:
          SUMMARY_FILE: ${{ steps.review.outputs.summary-file }}
        run: |
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ai-code-review -->")))][0].id // empty' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@"$SUMMARY_FILE" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$SUMMARY_FILE" > /dev/null
          fi

      - name: Set the verdict label
        if: steps.review.outcome == 'success'
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "pass" ]; then ADD="ai-cr:passed"; DROP="ai-cr:failed"; else ADD="ai-cr:failed"; DROP="ai-cr:passed"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$ADD" > /dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/${DROP//:/%3A}" > /dev/null || true

      - name: Remove the retry label
        if: always() && github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/ai-cr%3Areview" > /dev/null || true

      # Last on purpose: the comment and label are already published when the check turns red.
      - name: Fail the check on a fail verdict
        if: steps.review.outputs.verdict == 'fail'
        run: |
          echo "::error::AI review verdict: fail. See the PR comment for the findings."
          exit 1
